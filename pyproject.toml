[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coose"
version = "0.1.0"
description = "Turn any worldbuilding universe into a multiplayer, character-subjective AI roleplay game."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "argon2-cffi>=23.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "anthropic>=2.13",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
coose = "coose.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coose = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
