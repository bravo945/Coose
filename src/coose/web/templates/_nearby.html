<section id="nearby" class="stack">
    <h2 class="card__title">Here with {{ character.name }}</h2>
    {% for c in nearby %}
    <p class="cluster">
        {{ c.name }}
        {% if c.online %}<span class="module module--ok">player here</span>{% elif c.ai %}<span class="module">narrator plays</span>{% else %}<span class="module">player away</span>{% endif %}
    </p>
    {% else %}
    <small class="text-muted">Nobody else is here.</small>
    {% endfor %}
    <small>To speak, write it as an Action, for example: I tell the guard, "I'm only passing through."</small>
</section>
