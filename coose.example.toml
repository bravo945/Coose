# Copy this file to coose.toml and adjust it for your machine.
# Relative paths are resolved from the folder this file lives in.

[server]
# The public site. Point your Cloudflare tunnel at this address.
host = "127.0.0.1"
port = 8000

# Where the server keeps its own database (accounts, which story runs).
data_dir = "data"

# Where story folders live. Each subfolder is one story instance,
# built from the story-template folder.
stories_dir = "stories"

# Name of the environment variable holding the secret used to sign login
# cookies. Set it to a long random value, for example:
#   export COOSE_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
secret_key_env = "COOSE_SECRET_KEY"

[panel]
# The owner's private control panel (`coose panel`). Bind it to this machine's
# Tailscale address (run `tailscale ip -4`) so only your tailnet can reach it,
# and never point the Cloudflare tunnel at it.
host = "127.0.0.1"
port = 8001
# Name of the environment variable holding the panel's password.
password_env = "COOSE_PANEL_PASSWORD"

[ai]
# Name of the environment variable holding the Claude API key.
# The key itself never goes in this file or in a story folder.
api_key_env = "ANTHROPIC_API_KEY"

# The Claude model that narrates, and how much effort it puts into each pass
# (low, medium, high, xhigh, max). Higher effort is slower and costs more.
model = "claude-opus-5-5"
effort = "medium"

# How long the Premise and Rulebook stay cached between AI calls: "5m" or "1h".
# All passes on the same model share one cache; a cache that expires has to be
# written again at a premium. "1h" costs more per write but survives the pauses
# of real play; "5m" is cheaper only when actions come every few minutes.
cache_ttl = "1h"

# Actions as 2 passes (a Responder judges, then an Author writes) or 1 combined,
# cheaper pass.
action_passes = 2

# Per-task defaults. Tasks: action, witnesses, question, round, backfill, admin.
# Each takes model, effort and thinking ("on" or "off"; Opus 5.5 always thinks).
# Each story can override these from the owner panel or with `coose ai`.
# Every model in use keeps its own Premise cache, written about once an hour.
# [ai.tasks.witnesses]
# model = "claude-haiku-5-5"
# effort = "low"
# [ai.tasks.question]
# model = "claude-sonnet-5-5"
# effort = "low"
